<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>David & Ice Cream</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root{ --ui-text: rgba(255,255,255,0.92); }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body{
      font-family: "Press Start 2P", monospace;
      color: var(--ui-text);
      background: url("fon.png") center/cover no-repeat fixed;
      overflow:hidden;
    }

    .screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; }
    .hidden{ display:none !important; }
    .screen::before{
      content:""; position:absolute; inset:0;
      background: radial-gradient(1200px 700px at 50% 40%, rgba(0,0,0,0.18), rgba(0,0,0,0.58));
      pointer-events:none;
    }

    .card{
      position:relative;
      width:min(920px, 94vw);
      background: linear-gradient(180deg, rgba(22,26,38,0.92), rgba(10,12,18,0.86));
      border:1px solid rgba(255,255,255,0.16);
      border-radius:18px;
      box-shadow: 0 20px 85px rgba(0,0,0,0.55);
      overflow:hidden;
    }
    .card-inner{ padding:26px 22px; display:grid; grid-template-columns: 1fr; gap:16px; }

    .intro-hero{
      display:flex; flex-direction:column; align-items:center; text-align:center;
      gap:16px; padding:18px 14px 6px 14px;
    }
    .intro-hero img{
      width:min(360px, 62vw);
      height:auto;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
    }
    .intro-text{ font-size: 11px; line-height: 1.65; opacity:0.98; padding: 0 10px 10px 10px; }

    .button-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding-bottom: 18px; }

    .btn{
      font-family: inherit;
      font-size: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      color: rgba(255,255,255,0.92);
      background: linear-gradient(135deg, rgba(180,108,255,0.22), rgba(95,225,255,0.16));
      cursor:pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: transform 0.12s ease, filter 0.2s ease, border-color 0.2s ease;
      user-select:none;
    }
    .btn:hover{ transform: translateY(-2px); border-color: rgba(255,255,255,0.28); filter: brightness(1.06); }
    .btn:active{ transform: translateY(0px); }
    .btn-danger{ background: linear-gradient(135deg, rgba(255,77,109,0.24), rgba(180,108,255,0.14)); }
    .btn-ghost{ background: rgba(255,255,255,0.06); }

    #hud{
      position:fixed;
      top:14px; left:50%;
      transform: translateX(-50%);
      width:min(1100px, 94vw);
      display:flex; align-items:center; justify-content:space-between;
      gap:12px;
      padding: 12px 12px;
      background: rgba(8,10,16,0.55);
      border:1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      z-index:10;
    }
    .hud-block{ display:flex; flex-direction:column; gap:6px; min-width: 230px; }
    .hud-line{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      font-size:10px; color: rgba(255,255,255,0.82); white-space:nowrap;
    }
    .progress-wrap{ flex:1; min-width: 260px; display:flex; flex-direction:column; gap:8px; }
    .progress-bar{
      width:100%; height: 12px; border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
      overflow:hidden;
    }
    .progress-fill{ height:100%; width:0%; background: linear-gradient(90deg, rgba(180,108,255,0.85), rgba(95,225,255,0.85)); }

    #game{ position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:1; }

    .overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; z-index:20; }
    .overlay::before{ content:""; position:absolute; inset:0; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); }

    .panel{
      position:relative;
      width:min(860px, 94vw);
      background: linear-gradient(180deg, rgba(22,26,38,0.92), rgba(10,12,18,0.86));
      border:1px solid rgba(255,255,255,0.16);
      border-radius:18px;
      box-shadow: 0 20px 85px rgba(0,0,0,0.55);
      padding: 22px 18px;
    }
    .panel h2{ font-size: 13px; line-height:1.4; margin-bottom: 14px; color: rgba(255,255,255,0.94); }
    .panel p{ font-size: 10px; line-height:1.8; color: rgba(255,255,255,0.82); margin-bottom: 16px; }
    .panel .meta{ font-size: 10px; line-height:1.8; color: rgba(255,255,255,0.72); margin-bottom: 18px; }
    .panel-actions{ display:flex; gap:12px; justify-content:flex-start; flex-wrap:wrap; }

    .level-grid{ display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:12px; padding: 6px 0 4px 0; }
    .level-grid .btn{ width:100%; }

    @media (max-width: 820px){ .level-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px){ .level-grid{ grid-template-columns: 1fr; } }

    #levelsGrid .btn{ display:flex; align-items:center; justify-content:space-between; gap:12px; }

    .lvl-badge{
      font-size:9px; padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.78);
      white-space: nowrap;
    }
    .lvl-badge.done{
      background: rgba(55, 214, 122, 0.16);
      border-color: rgba(55, 214, 122, 0.32);
      color: rgba(180, 255, 205, 0.95);
    }
    .lvl-badge.todo{
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.16);
      color: rgba(255,255,255,0.76);
    }

    .btn-survive{ background: linear-gradient(135deg, rgba(255,77,109,0.24), rgba(95,225,255,0.16)); }

    .grid-sep{
      grid-column: 1 / -1;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.10), rgba(255,255,255,0.22), rgba(255,255,255,0.10));
      opacity: 0.9;
      margin: 2px 0;
    }
  </style>
</head>

<body>
  <section id="intro" class="screen">
    <div class="card">
      <div class="card-inner">
        <div class="intro-hero">
          <img src="1.png" alt="Intro image" />
          <div class="intro-text">
            David & Ice Cream — campaign.
          </div>
        </div>
        <div class="button-row">
          <button id="btnStart" class="btn">./ START</button>
        </div>
      </div>
    </div>
  </section>

  <section id="levelSelect" class="screen hidden">
    <div class="card">
      <div class="card-inner">
        <div class="intro-hero" style="padding-bottom:0;">
          <div style="font-size:13px; line-height:1.5;">SELECT</div>
          <div class="intro-text" style="padding-bottom:0;">
            Survive and Rush are separate from the campaign levels.
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
            <div style="font-size:10px; color:rgba(255,255,255,0.82);">PROGRESS</div>
            <div id="levelsProgressText" style="font-size:10px; color:rgba(255,255,255,0.82);">0 / 18</div>
          </div>
          <div style="height:12px; border-radius:999px; background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.14); overflow:hidden;">
            <div id="levelsProgressFill" style="height:100%; width:0%; background:linear-gradient(90deg, rgba(180,108,255,0.85), rgba(95,225,255,0.85));"></div>
          </div>

          <div class="level-grid" id="levelsGrid"></div>
        </div>

        <div class="button-row">
          <button id="btnBackToIntro" class="btn btn-ghost">./ MENU</button>
        </div>
      </div>
    </div>
  </section>

  <canvas id="game" class="hidden"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-block">
      <div class="hud-line"><span>MODE</span><span id="hudMode">CAMPAIGN</span></div>
      <div class="hud-line"><span>LEVEL</span><span id="hudLevel">1 / 18</span></div>
    </div>

    <div class="progress-wrap">
      <div class="hud-line"><span>PROGRESS</span><span id="hudProgressText">0%</span></div>
      <div class="progress-bar"><div id="hudProgressFill" class="progress-fill"></div></div>
    </div>

    <div class="hud-block">
      <div class="hud-line"><span>TIME / SCORE</span><span id="hudTime">00.0</span></div>
      <div class="hud-line"><span>GOAL</span><span id="hudGoal">—</span></div>
      <div class="hud-line"><span>COLLECTED</span><span id="hudCollected">0</span></div>
    </div>
  </div>

  <div id="levelOverlay" class="overlay hidden">
    <div class="panel">
      <h2 id="levelTitle">LEVEL 1</h2>
      <p id="levelTask">Task text…</p>
      <div class="panel-actions">
        <button id="btnLevelGo" class="btn">./ GO</button>
        <button id="btnBackMenuFromLevel" class="btn btn-ghost">./ LEVELS</button>
      </div>
    </div>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <div class="panel">
      <h2 id="gameOverTitle">GAME OVER</h2>
      <p id="gameOverReason">You failed the task.</p>
      <div class="meta" id="gameOverMeta">—</div>
      <div class="panel-actions">
        <button id="btnRestart" class="btn btn-danger">./ RESTART</button>
        <button id="btnLevels" class="btn btn-ghost">./ LEVELS</button>
        <button id="btnMenu" class="btn btn-ghost">./ MENU</button>
      </div>
    </div>
  </div>

      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Failed to load " + src));
        img.src = src;
      });
    }

    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
    function rand(a,b){ return a + Math.random()*(b-a); }
    function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

    function show(el){ el.classList.remove("hidden"); }
    function hide(el){ el.classList.add("hidden"); }

    function loadDoneArray(){
      try{
        const raw = localStorage.getItem(SAVE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        const out = new Array(LEVELS.length).fill(false);
        if (Array.isArray(arr)){
          for (let i=0; i<out.length; i++) out[i] = !!arr[i];
        }
        return out;
      }catch(e){
        return new Array(LEVELS.length).fill(false);
      }
    }
    function saveDoneArray(done){ localStorage.setItem(SAVE_KEY, JSON.stringify(done)); }

        const n = Number(raw ?? 0);
        return Number.isFinite(n) ? n : 0;
      }catch(e){ return 0; }
    }
    function saveBestScore(n){
      localStorage.setItem(SAVE_SURVIVE_BEST, String(Math.max(0, Math.floor(n))));
    }

    function loadRushBest(){
      try{
        const raw = localStorage.getItem(SAVE_RUSH_BEST);
        const n = Number(raw ?? 0);
        return Number.isFinite(n) ? n : 0;
      }catch(e){ return 0; }
    }
    function saveRushBest(n){
      localStorage.setItem(SAVE_RUSH_BEST, String(Math.max(0, Math.floor(n))));
    }

    function buildLevelsGrid(){

    function renderLevelsProgressUI(){
      const grid = document.getElementById("levelsGrid");
      const text = document.getElementById("levelsProgressText");
      const fill = document.getElementById("levelsProgressFill");
      if (!grid || !text || !fill) return;

      const total = LEVELS.length;
      const doneCount = STATE.doneLevels.filter(Boolean).length;

      text.textContent = `${doneCount} / ${total}`;
      fill.style.width = `${Math.round((doneCount / Math.max(1,total)) * 100)}%`;

      [...grid.querySelectorAll("button[data-level]")].forEach((btn) => {

        const isDone = !!STATE.doneLevels[idx];
        badge.textContent = isDone ? "DONE" : "NOT DONE";
        badge.classList.toggle("done", isDone);
        badge.classList.toggle("todo", !isDone);
      });

      STATE.running = false;
      hide(ui.canvas); hide(ui.hud); hide(ui.levelOverlay); hide(ui.gameOverOverlay); hide(ui.levelSelect);
      show(ui.intro);

      hide(ui.intro); hide(ui.levelSelect);

      show(ui.levelSelect);

    }
    function showLevelOverlay(title, task, goLabel){
      ui.levelTitle.textContent = title;
      ui.levelTask.textContent = task;
      ui.btnLevelGo.textContent = goLabel;
      show(ui.levelOverlay);
    }
    function hideLevelOverlay(){ hide(ui.levelOverlay); }

    function showGameOver(reason){
      STATE.running = false;
      ui.gameOverTitle.textContent = "GAME OVER";
      ui.gameOverReason.textContent = reason;

      if (STATE.mode === GAME_MODES.SURVIVE){
        STATE.bestScore = Math.max(STATE.bestScore, STATE.score);
        saveBestScore(STATE.bestScore);
        ui.gameOverMeta.textContent = `SURVIVE — Score: ${STATE.score} | Best: ${STATE.bestScore}`;
      } else if (STATE.mode === GAME_MODES.RUSH){
        const finishedStage = Math.max(0, STATE.rushStage - 1);
        STATE.rushBest = Math.max(STATE.rushBest, finishedStage);
        saveRushBest(STATE.rushBest);
        ui.gameOverMeta.textContent = `RUSH — Stage: ${finishedStage} | Best: ${STATE.rushBest} | Score: ${STATE.score}`;
      } else {
        const lvl = LEVELS[STATE.currentLevelIndex];
        const collectedLine = `Collected: W ${STATE.collected.white} / P ${STATE.collected.purple} / Y ${STATE.collected.yellow} / B ${STATE.collected.blue}`;
        const surviveLine = lvl.surviveSeconds ? ` | Survived: ${STATE.timeSurvived.toFixed(1)}s / ${lvl.surviveSeconds}s` : "";
        ui.gameOverMeta.textContent = `${lvl.name} — ${collectedLine}${surviveLine}`;
      }

    function makeEntity({ type, isEnemy, x, y, r, vx, vy }){
      return {
        type, isEnemy: !!isEnemy,
        x, y, r, vx, vy,
        shieldEnabled:false, shieldOn:false,
        shieldOnT:3.0, shieldOffT:1.5, shieldPhase:0,
      };
    }

    function spawnOne(type, isEnemy=false, opts={}){
      const r = opts.r ?? 20;
      let x = opts.x ?? rand(40, STATE.w - 40);
      let y = opts.y ?? rand(90, STATE.h - 60);

      if (dist2(x,y,STATE.player.x,STATE.player.y) < 180*180){
        x = rand(40, STATE.w - 40);
        y = rand(90, STATE.h - 60);
      }

      const baseV = (opts.baseV != null) ? opts.baseV : (isEnemy ? rand(130, 190) : rand(40, 85));
      const a = rand(0, Math.PI*2);

      const p = makeEntity({
        type, isEnemy,
        x, y, r,
        vx: (opts.vx != null ? opts.vx : Math.cos(a)*baseV),
        vy: (opts.vy != null ? opts.vy : Math.sin(a)*baseV),
      });

      STATE.pickups.push(p);
      return p;
    }

    function applyShieldsForLevel(lvl){
      if (!lvl || !lvl.shields || !lvl.shields.enabled) return;
      const types = new Set(lvl.shields.types || []);
      for (const p of STATE.pickups){
        if (p.isEnemy) continue;
        if (!types.has(p.type)) continue;
        p.shieldEnabled = true;
        p.shieldOnT = Number(lvl.shields.on ?? 3.0);
        p.shieldOffT = Number(lvl.shields.off ?? 1.5);
        p.shieldPhase = (lvl.shields.phaseOffsetRandom ? rand(0, p.shieldOnT + p.shieldOffT) : 0);
      }
    }

    function spawnPickupsForLevel(lvl){
      const spawn = lvl.spawn || {};
      if (spawn.white) for (let i=0;i<spawn.white;i++) spawnOne("white", false);
      if (spawn.purple) for (let i=0;i<spawn.purple;i++) spawnOne("purple", false);
      if (spawn.yellow) for (let i=0;i<spawn.yellow;i++) spawnOne("yellow", false);
      if (spawn.blue) for (let i=0;i<spawn.blue;i++) spawnOne("blue", false);

      const enemies = lvl.enemies || {};
      if (enemies.white) for (let i=0;i<enemies.white;i++) spawnOne("white", true);
      if (enemies.purple) for (let i=0;i<enemies.purple;i++) spawnOne("purple", true);
      if (enemies.yellow) for (let i=0;i<enemies.yellow;i++) spawnOne("yellow", true);
      if (enemies.blue) for (let i=0;i<enemies.blue;i++) spawnOne("blue", true);

      if (lvl.sequential && lvl.sequential.type){
        STATE.seqRemaining = Number(lvl.sequential.total || 0);
        if (STATE.seqRemaining > 0){
          spawnOne(lvl.sequential.type, false);
        }
      }

      applyShieldsForLevel(lvl);
    }

    function resetCampaignLevel(levelIndex){
      STATE.mode = GAME_MODES.CAMPAIGN;

      STATE.currentLevelIndex = levelIndex;
      STATE.pickups = [];
      STATE.collected = { white:0, purple:0, yellow:0, blue:0 };
      STATE.timeSurvived = 0;
      STATE.seqRemaining = 0;
      STATE.flashT = 0;
      STATE.levelTime = 0;

      const lvl = LEVELS[levelIndex];
      STATE.player.speed = Number(lvl.playerSpeedOverride || STATE.basePlayer.speed);

      STATE.player.x = STATE.w * 0.5;
      STATE.player.y = STATE.h * 0.62;

      STATE.timeLeft = lvl.timeLimit;
      spawnPickupsForLevel(lvl);
      updateHUD();
    }

    function resetSurvive(){
      STATE.mode = GAME_MODES.SURVIVE;

      STATE.pickups = [];
      STATE.collected = { white:0, purple:0, yellow:0, blue:0 };
      STATE.flashT = 0;
      STATE.levelTime = 0;

      STATE.score = 0;
      STATE.bestScore = loadBestScore();

      STATE.respawnQueue = [];
      STATE.surviveChaoticTimer = 0;
      STATE.surviveNextChaoticAt = SURVIVE.chaoticSpawnEvery + rand(0, SURVIVE.chaoticSpawnJitter);

      STATE.player.speed = SURVIVE.playerSpeed;
      STATE.player.x = STATE.w * 0.5;
      STATE.player.y = STATE.h * 0.62;

      for (let i=0;i<SURVIVE.keepOnField.white;i++) spawnOne("white", false);
      for (let i=0;i<SURVIVE.keepOnField.purple;i++) spawnOne("purple", false);

      for (let i=0;i<SURVIVE.enemies.magnetBlue;i++) spawnOne("blue", true, { baseV: rand(110,150) });
      for (let i=0;i<2;i++) spawnOne("yellow", true, { baseV: rand(190,260) });

      updateHUD();
    }

    function rollRushMod(stage){
      const mods = [
        { id: "FORBID_WHITE", title: "No White", forbidden: { white: true } },
        { id: "FORBID_PURPLE", title: "No Purple", forbidden: { purple: true } },
        { id: "SHIELDS_ALL", title: "Shields", shields: { enabled: true, types: ["white","purple"], on: 2.3, off: 0.7, phaseOffsetRandom: true } },
        { id: "PULSE", title: "Pulse", pulseMagnet: { enabled:true, period:1.8, onDuration:0.75, strength:520, speedCap:700, affectsPickups:true, affectsEnemies:false } },
        { id: "FAST", title: "Fast Player", playerSpeedOverride: 500 },
      ];

      let pool = mods;
      if (stage >= 6) pool = mods.filter(m => m.id !== "FAST");
      const m = pool[Math.floor(Math.random() * pool.length)];

      const yellowMax = stage >= 4 ? Math.min(4, Math.floor((stage - 2) / 2)) : 0;
      return { ...m, yellowMax };
    }

    function applyRushMod(){
      const m = STATE.rushMod || {};
      if (m.playerSpeedOverride) STATE.player.speed = Number(m.playerSpeedOverride);
      if (m.shields && m.shields.enabled){
        applyShieldsForLevel({ shields: m.shields });
      }
    }

    function resetRush(){
      STATE.mode = GAME_MODES.RUSH;

      STATE.pickups = [];
      STATE.collected = { white:0, purple:0, yellow:0, blue:0 };
      STATE.flashT = 0;
      STATE.levelTime = 0;

      STATE.score = 0;

      STATE.rushStage = 1;
      STATE.rushTimeLeft = RUSH.stageTime;
      STATE.rushStageScore = 0;
      STATE.rushBest = loadRushBest();

      STATE.respawnQueue = [];
      STATE.rushYellowTimer = 0;
      STATE.rushNextYellowAt = RUSH.yellowSpawnEvery + rand(0, RUSH.yellowSpawnJitter);

      STATE.player.speed = RUSH.playerSpeed;
      STATE.player.x = STATE.w * 0.5;
      STATE.player.y = STATE.h * 0.62;

      for (let i=0;i<RUSH.keepOnField.white;i++) spawnOne("white", false);
      for (let i=0;i<RUSH.keepOnField.purple;i++) spawnOne("purple", false);

      for (let i=0;i<RUSH.enemies.magnetBlue;i++) spawnOne("blue", true, { baseV: rand(110,150) });

      STATE.rushMod = rollRushMod(STATE.rushStage);
      applyRushMod();

      updateHUD();
    }

    function levelGoalTotal(lvl){
      const g = lvl.goal || {};
      const base = (g.white||0) + (g.purple||0) + (g.yellow||0) + (g.blue||0);
      if (lvl.surviveSeconds && lvl.surviveSeconds > 0) return Math.max(1, base + 1);
      return Math.max(1, base);
    }
    function levelCollectedForGoal(lvl){
      const g = lvl.goal || {};
      let sum = 0;
      if (g.white) sum += Math.min(STATE.collected.white, g.white);
      if (g.purple) sum += Math.min(STATE.collected.purple, g.purple);
      if (g.yellow) sum += Math.min(STATE.collected.yellow, g.yellow);
      if (g.blue) sum += Math.min(STATE.collected.blue, g.blue);
      if (lvl.surviveSeconds && lvl.surviveSeconds > 0){
        sum += (STATE.timeSurvived >= lvl.surviveSeconds) ? 1 : 0;
      }
      return sum;
    }
    function checkWinCampaign(){
      const lvl = LEVELS[STATE.currentLevelIndex];
      const g = lvl.goal || {};
      const okWhite = (STATE.collected.white >= (g.white||0));
      const okPurple = (STATE.collected.purple >= (g.purple||0));
      const okYellow = (STATE.collected.yellow >= (g.yellow||0));
      const okBlue = (STATE.collected.blue >= (g.blue||0));
      const okSurvive = (!lvl.surviveSeconds || lvl.surviveSeconds <= 0) ? true : (STATE.timeSurvived >= lvl.surviveSeconds);
      return okWhite && okPurple && okYellow && okBlue && okSurvive;
    }
    function winAndPromptNext(){
      STATE.doneLevels[STATE.currentLevelIndex] = true;
      saveDoneArray(STATE.doneLevels);

      if (STATE.currentLevelIndex + 1 < LEVELS.length){
        const nextIndex = STATE.currentLevelIndex + 1;
        resetCampaignLevel(nextIndex);
        showLevelOverlay(LEVELS[nextIndex].name, LEVELS[nextIndex].task, "./ " + LEVELS[nextIndex].name);
        STATE.running = false;
      } else {
        STATE.running = false;
        ui.gameOverTitle.textContent = "YOU WIN";
        ui.gameOverReason.textContent = "Campaign complete.";
        ui.gameOverMeta.textContent = `Finished: ${LEVELS.length} levels.`;
        show(ui.gameOverOverlay);
      }
    }

    function applySeek(dt, p, targetX, targetY, strength, cap){
      const dx = targetX - p.x;
      const dy = targetY - p.y;
      const d = Math.hypot(dx,dy) || 1;

      p.vx += (dx/d) * strength * dt;
      p.vy += (dy/d) * strength * dt;

      const sp = Math.hypot(p.vx,p.vy);
      if (sp > cap){
        p.vx = p.vx / sp * cap;
        p.vy = p.vy / sp * cap;
      }
    }

    function applyEnemyChaseCampaign(dt, lvl, p){
      let strength = 40;
      let cap = 230;
      const eb = lvl.enemyBehavior || null;
      if (eb && eb.mode === "magnet"){
        strength = Number(eb.magnetStrength ?? 260);
        cap = Number(eb.speedCap ?? 360);
      }
      applySeek(dt, p, STATE.player.x, STATE.player.y, strength, cap);
    }

    function updateShieldState(dt, lvl){
      if (!lvl || !lvl.shields || !lvl.shields.enabled) return;
      for (const p of STATE.pickups){
        if (!p.shieldEnabled) continue;
        const cycle = p.shieldOnT + p.shieldOffT;
        p.shieldPhase = (p.shieldPhase + dt) % Math.max(0.001, cycle);
        p.shieldOn = (p.shieldPhase < p.shieldOnT);
      }
    }

    function isPulseMagnetOn(lvl){
      const pm = lvl.pulseMagnet;
      if (!pm || !pm.enabled) return false;
      const period = Math.max(0.05, Number(pm.period ?? 2.0));
      const onD = clamp(Number(pm.onDuration ?? 1.0), 0.05, period);
      const phase = (STATE.levelTime % period);
      return phase < onD;
    }

    function applyCampaignMagnets(dt, lvl){
      if (lvl.magnetToPlayer && lvl.magnetToPlayer.enabled){
        const types = new Set(lvl.magnetToPlayer.types || []);
        const strength = Number(lvl.magnetToPlayer.strength ?? 380);
        const cap = Number(lvl.magnetToPlayer.speedCap ?? 520);
        for (const p of STATE.pickups){
          if (!p.isEnemy) continue;
          if (!types.has(p.type)) continue;
          applySeek(dt, p, STATE.player.x, STATE.player.y, strength, cap);
        }
      }

      if (lvl.pulseMagnet && lvl.pulseMagnet.enabled){
        if (!isPulseMagnetOn(lvl)) return;
        const strength = Number(lvl.pulseMagnet.strength ?? 420);
        const cap = Number(lvl.pulseMagnet.speedCap ?? 620);
        const affectPickups = !!lvl.pulseMagnet.affectsPickups;
        const affectEnemies = !!lvl.pulseMagnet.affectsEnemies;

        for (const p of STATE.pickups){
          if (p.isEnemy && !affectEnemies) continue;
          if (!p.isEnemy && !affectPickups) continue;
          applySeek(dt, p, STATE.player.x, STATE.player.y, strength, cap);
        }
      }
    }

    function countOnField(type, isEnemy=null){
      let n = 0;
      for (const p of STATE.pickups){
        if (p.type !== type) continue;
        if (isEnemy === null) { n++; continue; }
        if (!!p.isEnemy === !!isEnemy) n++;
      }
      return n;
    }

    function enqueueRespawn(type, delay){
      STATE.respawnQueue.push({ type, t: Math.max(0, delay) });
    }

    function updateRespawnQueue(dt){
      for (let i = STATE.respawnQueue.length - 1; i >= 0; i--){
        const it = STATE.respawnQueue[i];
        it.t -= dt;
        if (it.t <= 0){
          spawnOne(it.type, false);
          STATE.respawnQueue.splice(i, 1);
        }
      }
    }

    function updateSurviveSpawners(dt){
      const wantW = SURVIVE.keepOnField.white;
      const wantP = SURVIVE.keepOnField.purple;

      const haveW = countOnField("white", false) + STATE.respawnQueue.filter(x => x.type==="white").length;
      const haveP = countOnField("purple", false) + STATE.respawnQueue.filter(x => x.type==="purple").length;

      if (haveW < wantW) enqueueRespawn("white", SURVIVE.respawnDelayCollectible);
      if (haveP < wantP) enqueueRespawn("purple", SURVIVE.respawnDelayCollectible);

      updateRespawnQueue(dt);

      STATE.surviveChaoticTimer += dt;
      if (STATE.surviveChaoticTimer >= STATE.surviveNextChaoticAt){
        STATE.surviveChaoticTimer = 0;
        STATE.surviveNextChaoticAt = SURVIVE.chaoticSpawnEvery + rand(0, SURVIVE.chaoticSpawnJitter);

        const current = countOnField("yellow", true);
        if (current < SURVIVE.enemies.chaoticYellowMax){
          spawnOne("yellow", true, { baseV: rand(190,260) });
        }
      }
    }

    function updateRushSpawners(dt){
      const wantW = RUSH.keepOnField.white;
      const wantP = RUSH.keepOnField.purple;

      const haveW = countOnField("white", false) + STATE.respawnQueue.filter(x => x.type==="white").length;
      const haveP = countOnField("purple", false) + STATE.respawnQueue.filter(x => x.type==="purple").length;

      if (haveW < wantW) enqueueRespawn("white", RUSH.respawnDelayCollectible);
      if (haveP < wantP) enqueueRespawn("purple", RUSH.respawnDelayCollectible);

      updateRespawnQueue(dt);

      STATE.rushYellowTimer += dt;
      if (STATE.rushYellowTimer >= STATE.rushNextYellowAt){
        STATE.rushYellowTimer = 0;
        STATE.rushNextYellowAt = RUSH.yellowSpawnEvery + rand(0, RUSH.yellowSpawnJitter);

        const maxY = STATE.rushMod?.yellowMax ?? 0;
        const current = countOnField("yellow", true);
        if (current < maxY){
          spawnOne("yellow", true, { baseV: rand(RUSH.yellowBaseVMin, RUSH.yellowBaseVMax) });
        }
      }
    }

    function resizeCanvas(){
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      STATE.w = window.innerWidth;
      STATE.h = window.innerHeight;

      ui.canvas.width = Math.floor(STATE.w * dpr);
      ui.canvas.height = Math.floor(STATE.h * dpr);
      ui.canvas.style.width = STATE.w + "px";
      ui.canvas.style.height = STATE.h + "px";

      STATE.ctx.setTransform(dpr,0,0,dpr,0,0);
    }

    function update(dt){
      STATE.levelTime += dt;

      let mx = 0, my = 0;
      if (STATE.keys.has("ArrowLeft") || STATE.keys.has("a") || STATE.keys.has("A")) mx -= 1;
      if (STATE.keys.has("ArrowRight") || STATE.keys.has("d") || STATE.keys.has("D")) mx += 1;
      if (STATE.keys.has("ArrowUp") || STATE.keys.has("w") || STATE.keys.has("W")) my -= 1;
      if (STATE.keys.has("ArrowDown") || STATE.keys.has("s") || STATE.keys.has("S")) my += 1;

      const len = Math.hypot(mx,my) || 1;
      mx /= len; my /= len;

      STATE.player.x += mx * STATE.player.speed * dt;
      STATE.player.y += my * STATE.player.speed * dt;
      STATE.player.x = clamp(STATE.player.x, 28, STATE.w - 28);
      STATE.player.y = clamp(STATE.player.y, 72, STATE.h - 28);

      if (STATE.mode === GAME_MODES.CAMPAIGN){
        const lvl = LEVELS[STATE.currentLevelIndex];

        if (lvl.surviveSeconds && lvl.surviveSeconds > 0){
          STATE.timeSurvived += dt;
        }

        if (lvl.timeLimit < 9000){
          STATE.timeLeft -= dt;
          if (STATE.timeLeft <= 0){
            STATE.timeLeft = 0;
            if (checkWinCampaign()){ winAndPromptNext(); return; }
            showGameOver("Time is up.");
            return;
          }
        }

        updateShieldState(dt, lvl);
      } else if (STATE.mode === GAME_MODES.SURVIVE){
        updateSurviveSpawners(dt);
      } else {
        STATE.rushTimeLeft -= dt;
        if (STATE.rushTimeLeft <= 0){
          STATE.rushTimeLeft = 0;
          if (STATE.rushStageScore < RUSH.targetPerStage){
            showGameOver("Stage failed. Not enough score.");
            return;
          }

        }

        updateRushSpawners(dt);
        const m = STATE.rushMod || {};
        updateShieldState(dt, { shields: m.shields });
      }

      for (const p of STATE.pickups){
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        const pad = 26;
        if (p.x < pad){ p.x = pad; p.vx *= -1; }
        if (p.x > STATE.w - pad){ p.x = STATE.w - pad; p.vx *= -1; }
        if (p.y < 72){ p.y = 72; p.vy *= -1; }
        if (p.y > STATE.h - pad){ p.y = STATE.h - pad; p.vy *= -1; }
      }

      if (STATE.mode === GAME_MODES.CAMPAIGN){
        const lvl = LEVELS[STATE.currentLevelIndex];
        for (const p of STATE.pickups){
          if (!p.isEnemy) continue;
          applyEnemyChaseCampaign(dt, lvl, p);
        }
        applyCampaignMagnets(dt, lvl);
      } else if (STATE.mode === GAME_MODES.SURVIVE){
        for (const p of STATE.pickups){
          if (!p.isEnemy) continue;
          if (p.type === "blue"){
            applySeek(dt, p, STATE.player.x, STATE.player.y, SURVIVE.magnetStrength, SURVIVE.magnetSpeedCap);
          }
        }
      } else {
        for (const p of STATE.pickups){
          if (!p.isEnemy) continue;
          if (p.type === "blue"){
            applySeek(dt, p, STATE.player.x, STATE.player.y, RUSH.magnetStrength, RUSH.magnetSpeedCap);
          }
        }

        const m = STATE.rushMod || {};
        if (m.pulseMagnet && m.pulseMagnet.enabled){
          const pm = m.pulseMagnet;
          const period = Math.max(0.05, Number(pm.period ?? 2.0));
          const onD = clamp(Number(pm.onDuration ?? 1.0), 0.05, period);
          const phase = (STATE.levelTime % period);
          if (phase < onD){
            const strength = Number(pm.strength ?? 420);
            const cap = Number(pm.speedCap ?? 620);
            for (const p of STATE.pickups){
              if (p.isEnemy) continue;
              applySeek(dt, p, STATE.player.x, STATE.player.y, strength, cap);
            }
          }
        }
      }

      for (let i = STATE.pickups.length - 1; i >= 0; i--){
        const p = STATE.pickups[i];
        const rr = (STATE.player.r + p.r);
        if (dist2(STATE.player.x, STATE.player.y, p.x, p.y) <= rr*rr){

          if (p.isEnemy){
            showGameOver("You touched an enemy.");
            return;
          }

          // forbidden / shields checks
          if (STATE.mode === GAME_MODES.CAMPAIGN){
            const lvl = LEVELS[STATE.currentLevelIndex];
            if (lvl.forbidden && lvl.forbidden[p.type]){
              showGameOver("You touched a forbidden ice cream.");
              return;
            }
            if (p.shieldEnabled && p.shieldOn){
              STATE.flashT = 0.03;
              continue;
            }
          } else if (STATE.mode === GAME_MODES.RUSH){
            const forb = STATE.rushMod?.forbidden;
            if (forb && forb[p.type]){
              showGameOver("Forbidden this stage.");
              return;
            }
            if (p.shieldEnabled && p.shieldOn){
              STATE.flashT = 0.03;
              continue;
            }
          }

          STATE.pickups.splice(i, 1);

          if (p.type === "white") STATE.collected.white++;
          if (p.type === "purple") STATE.collected.purple++;
          if (p.type === "yellow") STATE.collected.yellow++;
          if (p.type === "blue") STATE.collected.blue++;

          if (STATE.mode === GAME_MODES.SURVIVE){
            if (p.type === "white" || p.type === "purple") STATE.score += 1;
            enqueueRespawn(p.type, SURVIVE.respawnDelayCollectible);
          } else if (STATE.mode === GAME_MODES.RUSH){
            if (p.type === "white" || p.type === "purple"){
              STATE.score += 1;
              STATE.rushStageScore += 1;
              enqueueRespawn(p.type, RUSH.respawnDelayCollectible);
            }

            if (STATE.rushStageScore >= RUSH.targetPerStage){
              STATE.rushStage += 1;
              STATE.rushStageScore = 0;
              STATE.rushTimeLeft = RUSH.stageTime;

              STATE.rushMod = rollRushMod(STATE.rushStage);
              STATE.player.speed = RUSH.playerSpeed;
              applyRushMod();
            }
          }

          STATE.flashT = 0.08;

          if (STATE.mode === GAME_MODES.CAMPAIGN){
            const lvl = LEVELS[STATE.currentLevelIndex];
            if (lvl.sequential && !p.isEnemy && p.type === lvl.sequential.type){
              STATE.seqRemaining = Math.max(0, STATE.seqRemaining - 1);
              if (STATE.seqRemaining > 0){
                spawnOne(lvl.sequential.type, false);
                applyShieldsForLevel(lvl);
              }
            }
            if (checkWinCampaign()){
              winAndPromptNext();
              return;
            }
          }
        }
      }

      STATE.flashT = Math.max(0, STATE.flashT - dt);
    }

    function draw(){
      const ctx = STATE.ctx;
      ctx.clearRect(0,0,STATE.w,STATE.h);

      for (const p of STATE.pickups) drawIceCream(p);
      drawPlayer();

      if (STATE.flashT > 0){
        ctx.save();
        ctx.globalAlpha = Math.min(0.25, STATE.flashT * 4);
        ctx.fillStyle = "white";
        ctx.fillRect(0,0,STATE.w,STATE.h);
        ctx.restore();
      }
    }

    function drawPlayer(){
      const ctx = STATE.ctx;
      const img = STATE.imgs.player;
      const size = 78;

      const t = performance.now() * 0.002;
      const bob = Math.sin(t) * 2;

      ctx.save();
      ctx.translate(STATE.player.x, STATE.player.y + bob);

      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.ellipse(0, size*0.46, size*0.32, size*0.14, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, -size/2, -size/2, size, size);
      ctx.restore();
    }

    function drawIceCream(p){
      const ctx = STATE.ctx;
      let img = STATE.imgs.white;
      if (p.type === "white") img = STATE.imgs.white;
      if (p.type === "purple") img = STATE.imgs.purple;
      if (p.type === "yellow") img = STATE.imgs.yellow;
      if (p.type === "blue") img = STATE.imgs.blue;

      const size = p.isEnemy ? 62 : 54;

      if (p.isEnemy){
        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = (p.type === "blue") ? "#5fe1ff" : "#ffd54a";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 38, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      if (p.shieldEnabled && p.shieldOn){
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = "#ffd54a";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 34, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      const t = performance.now() * 0.001;
      ctx.rotate(Math.sin(t + (p.x+p.y)*0.01) * (p.isEnemy ? 0.18 : 0.10));
      ctx.drawImage(img, -size/2, -size/2, size, size);
      ctx.restore();
    }

    function updateHUD(){
      if (STATE.mode === GAME_MODES.SURVIVE){
        ui.hudMode.textContent = "SURVIVE";
        ui.hudLevel.textContent = "—";
        ui.hudTime.textContent = String(STATE.score);
        ui.hudGoal.textContent = "SCORE";
        ui.hudCollected.textContent = `Best:${STATE.bestScore}`;

        ui.hudProgressText.textContent = "∞";
        ui.hudProgressFill.style.width = "100%";
        return;
      }

      if (STATE.mode === GAME_MODES.RUSH){
        ui.hudMode.textContent = "RUSH";
        ui.hudLevel.textContent = `STAGE ${STATE.rushStage}`;
        ui.hudTime.textContent = STATE.rushTimeLeft.toFixed(1);
        ui.hudGoal.textContent = `GET:${RUSH.targetPerStage}`;

        const modTitle = STATE.rushMod?.title ? ` | ${STATE.rushMod.title}` : "";
        ui.hudCollected.textContent = `${STATE.rushStageScore}/${RUSH.targetPerStage}${modTitle}`;

        const pct = Math.round((STATE.rushStageScore / Math.max(1, RUSH.targetPerStage)) * 100);
        ui.hudProgressText.textContent = pct + "%";
        ui.hudProgressFill.style.width = pct + "%";
        return;
      }

      const lvl = LEVELS[STATE.currentLevelIndex];
      ui.hudMode.textContent = "CAMPAIGN";
      ui.hudLevel.textContent = `${STATE.currentLevelIndex + 1} / ${LEVELS.length}`;
      ui.hudTime.textContent = (lvl.timeLimit >= 9000) ? "∞" : STATE.timeLeft.toFixed(1);

      const g = lvl.goal || {};
      const parts = [];
      if (g.white) parts.push(`W:${g.white}`);
      if (g.purple) parts.push(`P:${g.purple}`);
      if (g.yellow) parts.push(`Y:${g.yellow}`);
      if (g.blue) parts.push(`B:${g.blue}`);
      if (lvl.surviveSeconds && lvl.surviveSeconds > 0) parts.push(`SURVIVE:${lvl.surviveSeconds}s`);
      ui.hudGoal.textContent = parts.length ? parts.join(" ") : "—";

      const cParts = [];
      if (g.white) cParts.push(`W:${STATE.collected.white}`);
      if (g.purple) cParts.push(`P:${STATE.collected.purple}`);
      if (g.yellow) cParts.push(`Y:${STATE.collected.yellow}`);
      if (g.blue) cParts.push(`B:${STATE.collected.blue}`);
      if (lvl.surviveSeconds && lvl.surviveSeconds > 0) cParts.push(`S:${Math.min(lvl.surviveSeconds, STATE.timeSurvived).toFixed(1)}s`);
      ui.hudCollected.textContent = cParts.length ? cParts.join(" ") : "—";

      const total = levelGoalTotal(lvl);
      const got = levelCollectedForGoal(lvl);
      const pct = Math.round((got / total) * 100);
      ui.hudProgressText.textContent = pct + "%";
      ui.hudProgressFill.style.width = pct + "%";
    }

    function loop(t){
      const now = t || performance.now();
      const dt = Math.min(0.035, (now - STATE.lastT) / 1000 || 0);
      STATE.lastT = now;

      if (STATE.running){
        update(dt);
        updateHUD();
        draw();
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (e) => {
      if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
      STATE.keys.add(e.key);
    }, { passive:false });

    window.addEventListener("keyup", (e) => {
      STATE.keys.delete(e.key);
    });

    ui.btnStart.addEventListener("click", async () => {
      await ensureAssets();
      showLevelsMenu();
    });

    ui.btnBackToIntro.addEventListener("click", () => showIntro());

    ui.levelSelect.addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      if (btn.matches("button[data-mode='survive']")){
        await ensureAssets();
        showGameScene();
        resetSurvive();
        showLevelOverlay("./ SURVIVE", "Collect ice creams for score. Avoid enemies forever.", "./ SURVIVE");
        STATE.running = false;
        return;
      }

      if (btn.matches("button[data-mode='rush']")){
        await ensureAssets();
        showGameScene();
        resetRush();
        showLevelOverlay("./ RUSH", RUSH.task, "./ RUSH");
        STATE.running = false;
        return;
      }

      const levelBtn = btn.closest("button[data-level]");
      if (!levelBtn) return;
      const idx = Number(levelBtn.getAttribute("data-level"));
      if (!Number.isFinite(idx) || idx < 0 || idx >= LEVELS.length) return;

      showGameScene();
      resetCampaignLevel(idx);
      showLevelOverlay(LEVELS[idx].name, LEVELS[idx].task, "./ " + LEVELS[idx].name);
      STATE.running = false;
    });

    ui.btnBackMenuFromLevel.addEventListener("click", () => showLevelsMenu());

    ui.btnLevelGo.addEventListener("click", () => {
      hideLevelOverlay();
      hide(ui.gameOverOverlay);
      STATE.running = true;
    });

    ui.btnRestart.addEventListener("click", () => {
      hide(ui.gameOverOverlay);
      if (STATE.mode === GAME_MODES.SURVIVE){
        resetSurvive();
        showLevelOverlay("./ SURVIVE", "Collect ice creams for score. Avoid enemies forever.", "./ SURVIVE");
      } else if (STATE.mode === GAME_MODES.RUSH){
        resetRush();
        showLevelOverlay("./ RUSH", RUSH.task, "./ RUSH");
      } else {
        resetCampaignLevel(STATE.currentLevelIndex);
        showLevelOverlay(LEVELS[STATE.currentLevelIndex].name, LEVELS[STATE.currentLevelIndex].task, "./ " + LEVELS[STATE.currentLevelIndex].name);
      }
      STATE.running = false;
    });

    ui.btnLevels.addEventListener("click", () => showLevelsMenu());
    ui.btnMenu.addEventListener("click", () => showIntro());

    async function ensureAssets(){
      if (STATE.assetsReady) return;
      const [player, white, purple, yellow, blue] = await Promise.all([
        loadImage(ASSETS.player),
        loadImage(ASSETS.white),
        loadImage(ASSETS.purple),
        loadImage(ASSETS.yellow),
        loadImage(ASSETS.blue),
      ]);
      STATE.imgs = { player, white, purple, yellow, blue };
      STATE.assetsReady = true;
    }

    (function init(){
      STATE.doneLevels = loadDoneArray();
      STATE.bestScore = loadBestScore();
      STATE.rushBest = loadRushBest();
      buildLevelsGrid();

      STATE.ctx = ui.canvas.getContext("2d", { alpha: true });
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
